name: Build iOS App

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    # Hier nutzen wir nun das unterstützte macOS 15
    runs-on: macos-15

    defaults:
      run:
        # Ersetze ORDNER durch den exakten Namen deines Ordners auf GitHub!
        # Falls deine config.xml direkt auf der Startseite liegt, lösche die Zeilen 11 bis 14 einfach komplett.
        working-directory: Meine App

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Install Cordova
      run: npm install -g cordova

    - name: Prepare iOS Project
      run: |
        cordova platform add ios
        cordova prepare ios
        
    - name: Upload App Output
      uses: actions/upload-artifact@v4
      with:
        name: ios-app
        # Wenn du Zeile 11-14 gelöscht hast, entferne hier das "ORDNER/" am Anfang
        path: platforms/ios/


